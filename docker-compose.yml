services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: tracker
    ports:
      - "5432:5432"
    volumes:
      - ./migrations/001_initial.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./examples/sample_data.sql:/docker-entrypoint-initdb.d/02_data.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
